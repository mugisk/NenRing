name: Compatibility report / 動作報告
description: Tell us what worked on your Mac. 添付不要。正常に動作した環境も歓迎します。
title: "[Compatibility] "
labels: ["compatibility-report"]
body:
  - type: markdown
    attributes:
      value: |
        Reports are public. Please omit serial numbers and other identifiers.
        投稿内容は公開されます。シリアル番号などの個体識別情報は記載しないでください。
  - type: input
    id: environment
    attributes:
      label: Mac model and macOS version / Macの機種とmacOSのバージョン
      placeholder: MacBook Air (M1, 2020), macOS 26.1
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What worked or failed? / 動作結果
      description: A short note is enough. 表示できた値や、取得できなかった項目を一言ご記入ください。
      placeholder: SSD temperature and writes appeared. / SSDの温度と書込量を表示できました。
    validations:
      required: true
