# Archived reference only. Outside .github/workflows, so GitHub does not run it.
name: macOS Swift Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-swift-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    name: swift test (macOS 15)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Install SMART test dependency
        run: brew install smartmontools
      - name: Run test suite
        run: ./scripts/swiftpm.sh test
      - name: Build app bundle
        run: ./scripts/build-app.sh
